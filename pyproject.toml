[project]
name = "conversational-memory-rag"
version = "0.1.0"
description = "Conversational Memory RAG built from first principles."
requires-python = ">=3.12"

dependencies = [
    "openai>=1.0.0,<4.0.0",
    "chromadb>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pypdf>=5.0.0,<7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
